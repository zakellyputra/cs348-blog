# Activated when SPRING_PROFILES_ACTIVE=prod
# Cloud SQL Java connector: no host/port in the URL — the connector tunnels via IAM.
# CLOUD_SQL_INSTANCE format: <PROJECT_ID>:<REGION>:<INSTANCE_NAME>
spring.datasource.url=jdbc:mysql:///blog_app?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is initialized once manually against Cloud SQL — do not re-run on every boot.
spring.sql.init.mode=never

# Cloud Run sends $PORT; bind to it.
server.port=${PORT:8080}
